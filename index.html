<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Carpe Dièm Streetfood Kassa</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#080a0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}.app{position:absolute;inset:8px 8px 70px;display:flex;gap:10px}
.products{width:61%;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(88px,1fr);gap:7px;overflow:auto}
.p{appearance:none;background:#111416;color:#fff;border:1px solid #555;border-radius:9px;padding:6px;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:750;font-size:15px;touch-action:manipulation}
.p .pic{font-size:28px;line-height:1;margin-bottom:4px}.p small{font-size:14px;margin-top:4px;color:#eee}
.order{width:39%;height:100%;background:#0e1112;border:1px solid #444;border-radius:10px;padding:10px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#lines{flex:1;min-height:0;overflow:auto}.line{display:grid;grid-template-columns:minmax(0,1fr) 34px 22px 34px 34px;gap:4px;align-items:center;border-bottom:1px solid #303436;padding:7px 0;font-size:13px}
.name small{display:block;color:#ddd;margin-top:2px}.dep{color:#9bd9b5!important}.btn{border:0;border-radius:6px;background:#303538;color:#fff;font-size:19px;height:34px;padding:0}
.totals{flex:none;border-top:1px solid #555;padding-top:7px;font-size:15px}.row{display:flex;justify-content:space-between;margin:3px 0}.total{font-size:24px;font-weight:800;border-top:1px solid #aaa;padding-top:6px;margin-top:6px}
.pay{width:100%;height:48px;border:0;border-radius:7px;margin-top:7px;font-size:20px;font-weight:800;color:#fff}.pin{background:#11b968}.cash{background:#e9a916}
.bottom{position:absolute;left:8px;right:8px;bottom:8px;height:54px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.bottom button{background:#171b1d;border:1px solid #34393c;border-radius:8px;color:#fff;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10;padding:12px;overflow:auto}.panel{max-width:900px;margin:auto;background:#111416;border:1px solid #555;border-radius:12px;padding:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0}.close,.save,.addp{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.close{background:#444;color:#fff}.save{background:#11b968;color:#fff}.addp{background:#e9a916;color:#111}
.manage{margin-top:12px;display:grid;gap:8px}.editrow{display:grid;grid-template-columns:2fr .8fr .8fr .8fr 44px;gap:6px;align-items:center;background:#1a1e20;padding:7px;border-radius:8px}.editrow input,.editrow select{width:100%;padding:9px;border-radius:6px;border:1px solid #555;background:#0b0d0e;color:#fff}.editrow button{height:38px;border:0;border-radius:6px;background:#7b2525;color:#fff}
.note{color:#bbb;font-size:12px;margin-top:8px}
@media(max-width:850px){.products{width:60%}.order{width:40%}.p{font-size:12px}.p .pic{font-size:23px}.bottom button{font-size:11px}.editrow{grid-template-columns:1.5fr .7fr .7fr .8fr 40px}}
</style>
</head>
<body>
<div class="app"><section class="products" id="products"></section>
<aside class="order"><div id="lines"></div><div class="totals">
<div class="row"><span>Netto excl. btw</span><b id="sub">€ 0,00</b></div>
<div class="row"><span>BTW (9%)</span><span id="vat">€ 0,00</span></div>
<div class="row"><span>Statiegeld (geen btw)</span><span id="deposit">€ 0,00</span></div>
<div class="row total"><span>Totaal</span><span id="total">€ 0,00</span></div>
<button class="pay pin" onclick="pay('PIN')">▣ &nbsp; PIN</button>
<button class="pay cash" onclick="pay('CONTANT')">▣ &nbsp; CONTANT</button>
</div></aside></div>
<div class="bottom">
<button onclick="discount()">🏷 Korting %</button><button onclick="clearCart()">🗑 Wis alles</button>
<button onclick="window.print()">▣ Bon printen</button><button onclick="openDrawer()">🗄 Lade open</button>
<button onclick="openManage()">⚙️ Beheer</button>
</div>

<div class="modal" id="modal"><div class="panel">
<div class="head"><h2>⚙️ Productbeheer</h2><button class="close" onclick="closeManage()">Sluiten</button></div>
<p class="note">Pas naam, prijs, statiegeld en symbool aan. Wijzigingen worden op dit apparaat opgeslagen.</p>
<div id="manage" class="manage"></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="addp" onclick="addProduct()">+ Product toevoegen</button><button class="save" onclick="saveProducts()">Wijzigingen opslaan</button></div>
</div></div>

<script>
const defaults=[
{name:"Wrap met kip",price:8.50,deposit:0,pic:"🌯"},{name:"Wrap met rundvlees",price:9.50,deposit:0,pic:"🌯"},
{name:"Wrap falafel",price:7.50,deposit:0,pic:"🧆"},{name:"Wrap çiğköfte",price:5.50,deposit:0,pic:"🌯"},
{name:"Çiğköfte los (10 stuks)",price:9.50,deposit:0,pic:"🥬"},{name:"Linzensoep (300 ml)",price:4.50,deposit:0,pic:"🥣"},
{name:"Falafel los (7 stuks)",price:5.50,deposit:0,pic:"🧆"},{name:"Thee",price:2,deposit:0,pic:"🍵"},
{name:"Ayran",price:2,deposit:0,pic:"🥛"},{name:"Coca-Cola",price:2.50,deposit:.15,pic:"🥤"},
{name:"Coca-Cola Zero",price:2.50,deposit:.15,pic:"🥤"},{name:"Ice Tea Green",price:2.50,deposit:.15,pic:"🥤"},
{name:"Ice Tea Peach",price:2.50,deposit:.15,pic:"🥤"},{name:"Spa blauw",price:2.50,deposit:.15,pic:"💧"},
{name:"Spa rood",price:2.50,deposit:.15,pic:"💧"},{name:"Red Bull",price:3.50,deposit:.15,pic:"🥤"},
{name:"Capri-Sun",price:1.50,deposit:0,pic:"🧃"}];
let products=JSON.parse(localStorage.getItem("cd_products")||"null")||defaults.map(x=>({...x}));
let cart={},disc=0; const euro=n=>"€ "+Number(n).toFixed(2).replace(".",",");
function drawProducts(){let el=document.getElementById("products");el.innerHTML="";products.forEach((p,i)=>{let b=document.createElement("button");b.className="p";b.onclick=()=>add(i);b.innerHTML=`<span class="pic">${p.pic||"🍴"}</span>${p.name}<small>${euro(p.price)}${p.deposit?` + ${euro(p.deposit)} statiegeld`:""}</small>`;el.appendChild(b)})}
function add(i){cart[i]=(cart[i]||0)+1;render()} function qty(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];render()} function del(i){delete cart[i];render()}
function totals(){let gross=0,dep=0;Object.entries(cart).forEach(([i,q])=>{if(products[i]){gross+=products[i].price*q;dep+=products[i].deposit*q}});gross*=1-disc/100;return {gross,dep,total:gross+dep}}
function render(){let L=document.getElementById("lines");L.innerHTML="";Object.entries(cart).forEach(([i,q])=>{let p=products[i];if(!p)return;let d=document.createElement("div");d.className="line";d.innerHTML=`<div class="name">${p.name}<small>${euro(p.price)}</small>${p.deposit?`<small class="dep">+ ${euro(p.deposit)} statiegeld</small>`:""}</div><button class="btn" onclick="qty(${i},-1)">−</button><b>${q}</b><button class="btn" onclick="qty(${i},1)">+</button><button class="btn" onclick="del(${i})">🗑</button>`;L.appendChild(d)});let t=totals(),net=t.gross/1.09,vat=t.gross-net;sub.textContent=euro(net);document.getElementById("vat").textContent=euro(vat);deposit.textContent=euro(t.dep);total.textContent=euro(t.total)}
function clearCart(){if(Object.keys(cart).length&&confirm("Bestelling wissen?")){cart={};disc=0;render()}}
function discount(){let x=prompt("Kortingspercentage:",disc||"");if(x!==null){x=Number(String(x).replace(",","."));if(x>=0&&x<=100){disc=x;render()}}}
function pay(method){if(!Object.keys(cart).length)return alert("Nog geen producten gekozen.");let t=totals(),sale={time:new Date().toISOString(),method,total:t.total,deposit:t.dep,discount:disc,items:Object.entries(cart).map(([i,q])=>({name:products[i].name,price:products[i].price,deposit:products[i].deposit,qty:q}))};let s=JSON.parse(localStorage.getItem("cd_sales")||"[]");s.push(sale);localStorage.setItem("cd_sales",JSON.stringify(s));alert(method+" geregistreerd: "+euro(sale.total));cart={};disc=0;render()}
function openDrawer(){alert("Lade-openknop staat klaar. De fysieke lade koppelen we aan de bonprinter.")}
function openManage(){drawManage();modal.style.display="block"} function closeManage(){modal.style.display="none"}
function drawManage(){let m=document.getElementById("manage");m.innerHTML="";products.forEach((p,i)=>{let r=document.createElement("div");r.className="editrow";r.innerHTML=`<input data-i="${i}" data-k="name" value="${p.name.replaceAll('"','&quot;')}"><input data-i="${i}" data-k="price" inputmode="decimal" value="${p.price.toFixed(2)}"><select data-i="${i}" data-k="deposit"><option value="0" ${!p.deposit?"selected":""}>Geen statiegeld</option><option value=".15" ${p.deposit?".15"==String(p.deposit)?"selected":"":""}>€ 0,15</option></select><input data-i="${i}" data-k="pic" value="${p.pic||""}"><button onclick="removeProduct(${i})">🗑</button>`;m.appendChild(r)})}
function readManage(){document.querySelectorAll("#manage [data-i]").forEach(e=>{let i=+e.dataset.i,k=e.dataset.k,v=e.value;if(k=="price"||k=="deposit")v=Number(String(v).replace(",","."))||0;products[i][k]=v})}
function addProduct(){readManage();products.push({name:"Nieuw product",price:0,deposit:0,pic:"🍴"});drawManage()}
function removeProduct(i){if(confirm("Product verwijderen?")){readManage();products.splice(i,1);drawManage()}}
function saveProducts(){readManage();localStorage.setItem("cd_products",JSON.stringify(products));cart={};drawProducts();render();closeManage();alert("Producten opgeslagen.")}
drawProducts();render();
</script></body></html>
