products=products.map(p=>drinkPhotos[p.name]?{...p,img:drinkPhotos[p.name],pic:""}:p);
let cart={},disc=0;const euro=n=>"€ "+Number(n).toFixed(2).replace(".",",");
function drawProducts(){productsEl.innerHTML="";products.forEach((p,i)=>{let b=document.createElement("button");b.className="p";b.onclick=()=>add(i);let visual=p.img?`<img class="photo" src="${p.img}">`:`<div class="drinkpic">${p.pic||"🍴"}</div>`;b.innerHTML=visual+`<div class="caption">${p.name}<small>${euro(p.price)}</small></div>`;productsEl.appendChild(b)})}
const productsEl=document.getElementById("products");
function add(i){if(!cart[i])cart[i]={qty:0,price:products[i].price};cart[i].qty++;render()}
function qty(i,d){if(!cart[i])return;cart[i].qty+=d;if(cart[i].qty<=0)delete cart[i];render()}
function del(i){delete cart[i];render()}
function editPrice(i){if(!cart[i])return;let x=prompt("Prijs voor deze bestelling:",cart[i].price.toFixed(2).replace(".",","));if(x===null)return;x=Number(String(x).replace(",","."));if(Number.isFinite(x)&&x>=0){cart[i].price=x;render()}else alert("Vul een geldige prijs in.")}
function totals(){let gross=0,dep=0;Object.entries(cart).forEach(([i,c])=>{if(products[i]){gross+=c.price*c.qty;dep+=products[i].deposit*c.qty}});gross*=1-disc/100;return{gross,dep,total:gross+dep}}
function render(){lines.innerHTML="";Object.entries(cart).forEach(([i,c])=>{let p=products[i];if(!p)return;let d=document.createElement("div");d.className="line";d.innerHTML=`<div class="name">${p.name}<small><button class="pricebtn" onclick="editPrice(${i})">${euro(c.price)} ✎</button></small>${p.deposit?`<small class="dep">+ ${euro(p.deposit)} statiegeld</small>`:""}</div><button class="btn" onclick="qty(${i},-1)">−</button><b>${c.qty}</b><button class="btn" onclick="qty(${i},1)">+</button><button class="btn" onclick="del(${i})">🗑</button>`;lines.appendChild(d)});let t=totals(),net=t.gross/1.09,btw=t.gross-net;sub.textContent=euro(net);vat.textContent=euro(btw);deposit.textContent=euro(t.dep);total.textContent=euro(t.total)}
function clearCart(){if(Object.keys(cart).length&&confirm("Bestelling wissen?")){cart={};disc=0;render()}}
function discount(){let x=prompt("Kortingspercentage:",disc||"");if(x!==null){x=Number(String(x).replace(",","."));if(x>=0&&x<=100){disc=x;render()}}}
function pay(method){if(!Object.keys(cart).length)return alert("Nog geen producten gekozen.");let t=totals(),sale={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),time:new Date().toISOString(),method,total:t.total,deposit:t.dep,discount:disc,items:Object.entries(cart).map(([i,c])=>({name:products[i].name,price:c.price,deposit:products[i].deposit,qty:c.qty}))};let sales=JSON.parse(localStorage.getItem("cd_sales")||"[]");sales.push(sale);localStorage.setItem("cd_sales",JSON.stringify(sales));alert(method+" geregistreerd: "+euro(sale.total));cart={};disc=0;render()}
function localDay(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function saleDay(s){return localDay(new Date(s.time))}
function openHistory(){historyDate.value=localDay(new Date());drawHistory();historyModal.style.display="block"}
function closeHistory(){historyModal.style.display="none"}
function changeDay(n){let d=new Date(historyDate.value+"T12:00:00");d.setDate(d.getDate()+n);historyDate.value=localDay(d);drawHistory()}
function drawHistory(){let all=JSON.parse(localStorage.getItem("cd_sales")||"[]"),day=historyDate.value,list=all.filter(s=>saleDay(s)===day),sum=list.reduce((a,s)=>a+Number(s.total||0),0),pin=list.filter(s=>s.method==="PIN").reduce((a,s)=>a+Number(s.total||0),0),cash=list.filter(s=>s.method==="CONTANT").reduce((a,s)=>a+Number(s.total||0),0);historySummary.textContent=`${list.length} bestelling${list.length===1?"":"en"} • Omzet ${euro(sum)} • PIN ${euro(pin)} • Contant ${euro(cash)}`;historyList.innerHTML="";[...list].reverse().forEach(s=>{let idx=all.indexOf(s),d=document.createElement("div");d.className="sale";let time=new Date(s.time).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});d.innerHTML=`<div class="saleHead"><span>${time} • ${s.method||"-"}</span><span>${euro(s.total||0)}</span></div><div class="saleItems">${(s.items||[]).map(x=>`${x.qty}× ${x.name} à ${euro(x.price)}`).join("<br>")||"Geen productdetails beschikbaar"}</div><div style="text-align:right;margin-top:7px"><button class="danger" onclick="deleteSale(${idx})">Verwijder bestelling</button></div>`;historyList.appendChild(d)})}
function deleteSale(i){if(!confirm("Deze bestelling verwijderen? De dagomzet wordt aangepast."))return;let all=JSON.parse(localStorage.getItem("cd_sales")||"[]");all.splice(i,1);localStorage.setItem("cd_sales",JSON.stringify(all));drawHistory()}
function openDrawer(){alert("Lade-openknop staat klaar. De fysieke lade koppelen we aan de bonprinter.")}
function openManage(){drawManage();modal.style.display="block"}function closeManage(){modal.style.display="none"}
function drawManage(){manage.innerHTML="";products.forEach((p,i)=>{let r=document.createElement("div");r.className="editrow";r.innerHTML=`<input data-i="${i}" data-k="name" value="${p.name.replaceAll('"','&quot;')}"><input data-i="${i}" data-k="price" inputmode="decimal" value="${p.price.toFixed(2)}"><select data-i="${i}" data-k="deposit"><option value="0" ${!p.deposit?"selected":""}>Geen statiegeld</option><option value=".15" ${p.deposit===.15?"selected":""}>€ 0,15</option></select><button onclick="removeProduct(${i})">🗑</button>`;manage.appendChild(r)})}
function readManage(){document.querySelectorAll("#manage [data-i]").forEach(e=>{let i=+e.dataset.i,k=e.dataset.k,v=e.value;if(k=="price"||k=="deposit")v=Number(String(v).replace(",","."))||0;products[i][k]=v})}
function addProduct(){readManage();products.push({name:"Nieuw product",price:0,deposit:0,pic:"🍴",img:""});drawManage()}function removeProduct(i){if(confirm("Product verwijderen?")){readManage();products.splice(i,1);drawManage()}}
function saveProducts(){readManage();localStorage.setItem("cd_products",JSON.stringify(products.map(({img,...x})=>x)));cart={};drawProducts();render();closeManage();alert("Producten opgeslagen.")}
drawProducts();render();
</script></body></html>
