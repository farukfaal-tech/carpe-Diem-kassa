let saved=JSON.parse(localStorage.getItem("cd_products")||"null");
let products=defaults.map((d,i)=>{let s=saved&&saved[i];return s?{...d,name:s.name??d.name,price:Number(s.price??d.price),deposit:Number(s.deposit??d.deposit),pic:s.pic??d.pic}:({...d})});
let cart={},disc=0;const euro=n=>"€ "+Number(n).toFixed(2).replace(".",",");
function drawProducts(){productsEl.innerHTML="";products.forEach((p,i)=>{let b=document.createElement("button");b.className="p";b.onclick=()=>add(i);let visual=p.img?`<img class="photo" src="${p.img}">`:`<div class="drinkpic">${p.pic||"🍴"}</div>`;b.innerHTML=visual+`<div class="caption">${p.name}<small>${euro(p.price)}</small></div>`;productsEl.appendChild(b)})}
const productsEl=document.getElementById("products");function add(i){cart[i]=(cart[i]||0)+1;render()}function qty(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];render()}function del(i){delete cart[i];render()}
function totals(){let gross=0,dep=0;Object.entries(cart).forEach(([i,q])=>{if(products[i]){gross+=products[i].price*q;dep+=products[i].deposit*q}});gross*=1-disc/100;return{gross,dep,total:gross+dep}}
function render(){lines.innerHTML="";Object.entries(cart).forEach(([i,q])=>{let p=products[i];if(!p)return;let d=document.createElement("div");d.className="line";d.innerHTML=`<div class="name">${p.name}<small>${euro(p.price)}</small>${p.deposit?`<small class="dep">+ ${euro(p.deposit)} statiegeld</small>`:""}</div><button class="btn" onclick="qty(${i},-1)">−</button><b>${q}</b><button class="btn" onclick="qty(${i},1)">+</button><button class="btn" onclick="del(${i})">🗑</button>`;lines.appendChild(d)});let t=totals(),net=t.gross/1.09,btw=t.gross-net;sub.textContent=euro(net);vat.textContent=euro(btw);deposit.textContent=euro(t.dep);total.textContent=euro(t.total)}
function clearCart(){if(Object.keys(cart).length&&confirm("Bestelling wissen?")){cart={};disc=0;render()}}function discount(){let x=prompt("Kortingspercentage:",disc||"");if(x!==null){x=Number(String(x).replace(",","."));if(x>=0&&x<=100){disc=x;render()}}}
function pay(method){if(!Object.keys(cart).length)return alert("Nog geen producten gekozen.");let t=totals(),sale={time:new Date().toISOString(),method,total:t.total,deposit:t.dep,discount:disc,items:Object.entries(cart).map(([i,q])=>({name:products[i].name,price:products[i].price,deposit:products[i].deposit,qty:q}))};let s=JSON.parse(localStorage.getItem("cd_sales")||"[]");s.push(sale);localStorage.setItem("cd_sales",JSON.stringify(s));alert(method+" geregistreerd: "+euro(sale.total));cart={};disc=0;render()}
function openDrawer(){alert("Lade-openknop staat klaar. De fysieke lade koppelen we aan de bonprinter.")}function openManage(){drawManage();modal.style.display="block"}function closeManage(){modal.style.display="none"}
function drawManage(){manage.innerHTML="";products.forEach((p,i)=>{let r=document.createElement("div");r.className="editrow";r.innerHTML=`<input data-i="${i}" data-k="name" value="${p.name.replaceAll('"','&quot;')}"><input data-i="${i}" data-k="price" inputmode="decimal" value="${p.price.toFixed(2)}"><select data-i="${i}" data-k="deposit"><option value="0" ${!p.deposit?"selected":""}>Geen statiegeld</option><option value=".15" ${p.deposit===.15?"selected":""}>€ 0,15</option></select><button onclick="removeProduct(${i})">🗑</button>`;manage.appendChild(r)})}
function readManage(){document.querySelectorAll("#manage [data-i]").forEach(e=>{let i=+e.dataset.i,k=e.dataset.k,v=e.value;if(k=="price"||k=="deposit")v=Number(String(v).replace(",","."))||0;products[i][k]=v})}
function addProduct(){readManage();products.push({name:"Nieuw product",price:0,deposit:0,pic:"🍴",img:""});drawManage()}function removeProduct(i){if(confirm("Product verwijderen?")){readManage();products.splice(i,1);drawManage()}}
function saveProducts(){readManage();localStorage.setItem("cd_products",JSON.stringify(products.map(({img,...x})=>x)));cart={};drawProducts();render();closeManage();alert("Producten opgeslagen.")}
drawProducts();render();
